{% load wagtailcore_tags %}

{% if ancestors %}
    <nav class="mx-auto w-full max-w-6xl px-4 pt-4" aria-label="Breadcrumb">
        <div class="breadcrumbs text-sm">
            <ul>
                {% for ancestor in ancestors %}
                    {% if forloop.last %}
                        <li aria-current="page">{{ ancestor }}</li>
                    {% else %}
                        <li><a href="{% pageurl ancestor %}">{% if forloop.first %}Home{% else %}{{ ancestor }}{% endif %}</a></li>
                    {% endif %}
                {% endfor %}
            </ul>
        </div>
    </nav>
{% endif %}
