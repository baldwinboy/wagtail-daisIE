{% load i18n wagtailcore_tags %}
<div class="drawer" {% if menu_theme %}data-theme="{{ menu_theme.name }}"{% endif %}>
  <input id="menu-drawer-{{ menu.name|slugify }}" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">
    <label for="menu-drawer-{{ menu.name|slugify }}" class="btn btn-ghost drawer-button lg:hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span class="sr-only">{% trans "Toggle menu" %}</span>
    </label>
  </div>
  <div class="drawer-side z-40">
    <label for="menu-drawer-{{ menu.name|slugify }}" aria-label="{% trans 'Close menu' %}" class="drawer-overlay"></label>
    <ul class="menu {{ block_css }} min-h-full w-80 gap-1 p-4">
      {% if menu.branding %}<li>{% include_block menu.branding %}</li>{% endif %}
      {% for item in menu_items %}
        <li>{% include_block item %}</li>
      {% endfor %}
    </ul>
  </div>
</div>
