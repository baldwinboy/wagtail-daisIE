{% load wagtailcore_tags %}
<ul class="daisyui-menu menu menu-vertical {{ menu_design_css }} {{ menu_css }}"{% if menu_design_style %} style="{{ menu_design_style }}"{% endif %}
    {% if menu_theme %}data-theme="{{ menu_theme.name }}"{% endif %}>
  {% for item in menu_items %}
    <li>{% include_block item %}</li>
  {% endfor %}
</ul>
