{% if audience_allowed %}
  <progress
    class="progress {{ value.color }}{% if block_css %} {{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}
    value="{{ progress_value }}"
    max="{{ value.maximum }}"
    {% if value.label %}aria-label="{{ value.label }}"{% endif %}
  ></progress>
{% endif %}
