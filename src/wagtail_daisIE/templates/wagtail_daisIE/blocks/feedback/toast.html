{% load notifications wagtailcore_tags %}
{% if audience_allowed %}
  <div
    class="toast {{ value.position }}{% if block_css %} {{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}
    role="status"
    aria-live="polite"
  >
    <div class="alert {{ value.color }}">
      {% if value.content %}<div class="daisie-richtext">{% daisie_richtext value.content %}</div>{% endif %}
      {% if value.body %}<div class="daisie-richtext">{% for child in value.body %}{% include_block child %}{% endfor %}</div>{% endif %}
    </div>
  </div>
{% endif %}
