{% if audience_allowed %}
  <ul class="steps {{ value.direction }}{% if block_css %} {{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    {% for step in value.steps %}
      <li class="step{% if forloop.counter <= value.active %} {{ value.color }}{% endif %}">{{ step }}</li>
    {% endfor %}
  </ul>
{% endif %}
