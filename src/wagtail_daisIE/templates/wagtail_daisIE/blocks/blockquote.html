{% load notifications %}
{% if audience_allowed %}
  <blockquote class="{% if block_css %}{{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    <p>{% daisie_markup value.text %}</p>
    {% if value.attribute_name %}
      <cite>{% daisie_markup value.attribute_name %}</cite>
    {% endif %}
  </blockquote>
{% endif %}
