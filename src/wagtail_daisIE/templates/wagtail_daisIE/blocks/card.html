{% load wagtailcore_tags %}
{% if audience_allowed %}
  <div class="card bg-base-100 {{ block_css }} {{ alignment_css|default:"" }} {{ card_default_css }}{% if card_clickable %} relative{% if not has_scroll %} overflow-hidden{% endif %} cursor-pointer{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    <div class="card-body">
      {% for child in value.content %}
        {% if card_clickable %}
          {% with card_clickable_container=True %}{% include_block child %}{% endwith %}
        {% else %}
          {% include_block child %}
        {% endif %}
      {% endfor %}
    </div>
  </div>
{% endif %}
