{% load wagtailcore_tags %}
<details class="collapse collapse-arrow" name="accordion-{{ block.id }}"{% if not value.collapsed %} open{% endif %}>
  <summary class="collapse-title">
    {% include_block value.heading %}
  </summary>
  <div class="collapse-content">
    {% for child in value.content %}
      {% include_block child %}
    {% endfor %}
  </div>
</details>
