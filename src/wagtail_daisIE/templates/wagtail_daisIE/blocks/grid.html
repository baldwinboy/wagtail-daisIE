{% load wagtailcore_tags %}
{% if audience_allowed %}
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-{{ value.num_columns|default:2 }} {{ value.gap|default:"gap-4" }} {{ value.horizontal_alignment|default:"" }} {{ value.vertical_alignment|default:"" }} {{ block_css|default:"" }}">
    {% for child in value.content %}
      <div>{% include_block child %}</div>
    {% endfor %}
  </div>
{% endif %}
