{% load wagtailcore_tags %}
{% if audience_allowed %}
  <div class="flex flex-col {{ value.horizontal_alignment|default:"" }} {{ value.vertical_alignment|default:"" }} gap-4 {{ block_css|default:"" }}">
    {% for child in value.content %}
      <div>{% include_block child %}</div>
    {% endfor %}
  </div>
{% endif %}
