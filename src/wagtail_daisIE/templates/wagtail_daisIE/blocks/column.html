{% load wagtailcore_tags %}
{% if audience_allowed %}
  <div class="flex flex-col {{ block_css|default:"" }} {{ alignment_css|default:"" }}"{% if block_style %} style="{{ block_style }}"{% endif %}>
  {% for child in value.content %}
    {% if child.block_type == "layout_item" or child.block_type == "layout_item_inline" %}
      {{ child }}
    {% else %}
      <div>{% include_block child %}</div>
    {% endif %}
  {% endfor %}
  </div>
{% endif %}
