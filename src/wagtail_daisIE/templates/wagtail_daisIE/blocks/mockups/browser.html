{% load wagtailcore_tags %}
{% if audience_allowed %}
  <div class="mockup-browser border bg-base-300 {{ block_css|default:"" }}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    <div class="mockup-browser-toolbar">
      <div class="input">{{ value.url }}</div>
    </div>
    <div class="bg-base-200 p-4">
      {% for child in value.content %}{% include_block child %}{% endfor %}
    </div>
  </div>
{% endif %}
