{% load i18n %}
<div id="daisie-feed-body-{{ block_id }}" data-daisie-feed-body="{{ block_id }}"{% if total is not None %} data-daisie-feed-total="{{ total }}"{% endif %}>
  <div
    id="daisie-feed-items-{{ block_id }}"
    data-daisie-feed-items
    data-daisie-feed-layout="{{ layout }}"
    class="{{ layout_container_css }}"
  >{{ items_html|safe }}</div>

  {% if not items_html %}
    <p class="text-base-content/70">{{ empty_message }}</p>
  {% endif %}

  <div data-daisie-feed-status aria-live="polite"></div>

  {% include "wagtail_daisIE/blocks/data/feed_pagination.html" with block_id=block_id oob=False hide_previous=False %}
</div>
