{% load i18n wagtail_daisIE_tags notifications %}
{% if audience_allowed %}
  {% if stretch_to_parent %}
    <button
      type="submit"
      class="absolute! inset-0!"
      aria-label="{% if value.text %}{{ value.text|daisie_strip_markup }}{% else %}{% trans 'Run action' %}{% endif %}"
    ></button>
  {% else %}
    <button type="submit" class="{% if block_css %}{{ block_css }}{% else %}btn{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
      {% if value.icon and not value.icon_after %}{% daisyui_icon value.icon %}{% endif %}{% daisie_markup value.text allow_links=False %}{% if value.icon and value.icon_after %}{% daisyui_icon value.icon %}{% endif %}
    </button>
  {% endif %}
{% endif %}
