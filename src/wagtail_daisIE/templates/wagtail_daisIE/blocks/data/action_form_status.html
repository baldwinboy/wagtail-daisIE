{% load notifications wagtail_daisIE_tags %}
{% if message_text %}
  <div
    class="alert{% if message_tags %} {{ message_tags }}{% else %} alert-{{ message_level|default:'info' }}{% endif %}"
    role="alert"
  >
    {% if message_icon %}{% daisyui_icon message_icon %}{% endif %}
    {% daisie_markup message_text %}
  </div>
{% endif %}
