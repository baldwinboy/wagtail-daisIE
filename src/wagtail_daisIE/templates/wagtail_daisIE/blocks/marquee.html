{% if audience_allowed %}
  <div class="overflow-hidden {{ block_css|default:"bg-base-200 p-4" }}">
    <div class="flex {{ value.direction|default:"flex-row" }} {{ value.speed|default:"animate-[marquee_20s_linear_infinite]" }} whitespace-nowrap">
      <span class="px-8">{{ value.text }}</span>
      <span class="px-8" aria-hidden="true">{{ value.text }}</span>
    </div>
  </div>
{% endif %}
