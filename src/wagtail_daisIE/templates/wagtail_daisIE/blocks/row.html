{% load wagtailcore_tags wagtail_daisIE_tags %}
{% if audience_allowed %}
  <div class="flex {{ row_wrap_css }} {{ row_scroll_css }} {{ block_css|default:"" }} {{ alignment_css|default:"" }}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    {% for child in value.content %}
      <div class="{{ row_item_css }}">
        {% include_block child %}
      </div>
    {% endfor %}
  </div>
{% endif %}
