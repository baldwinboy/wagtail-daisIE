{% load wagtailcore_tags wagtail_daisIE_tags %}
{% if audience_allowed %}
  <div class="flex {{ value.wrap|default:"flex-wrap" }} {{ block_css|default:"" }} {{ alignment_css|default:"" }}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    {% for child in value.content %}
      <div class="flex-1 min-w-0">
        {% include_block child %}
      </div>
    {% endfor %}
  </div>
{% endif %}
