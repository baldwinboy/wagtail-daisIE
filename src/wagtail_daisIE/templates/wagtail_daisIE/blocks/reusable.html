{% load wagtailcore_tags %}

<div class="{% if block_css %}{{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
  {% for child in value.reusable.content %}{% include_block child %}{% endfor %}
</div>
{% endif %}
