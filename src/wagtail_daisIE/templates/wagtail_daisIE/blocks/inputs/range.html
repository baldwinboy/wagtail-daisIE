{% load notifications %}
{% firstof id block.id as field_id %}
{% if audience_allowed %}
  <fieldset class="fieldset w-full{% if block_css %} {{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    {% if field_layout_configured %}
      <div class="{{ field_layout_css }}">
        {% if not field_label_hidden %}
          <div class="{{ field_label_css }}" data-daisie-field-part="label">
            <label class="fieldset-legend" for="daisie-{{ field_id }}">{{ value.label }}</label>
          </div>
        {% endif %}
        <div class="{{ field_input_css }}" data-daisie-field-part="input">
          <input
            id="daisie-{{ field_id }}"
            type="range"
            {% if value.name %}name="{{ value.name }}"{% endif %}
            min="{{ value.minimum }}"
            max="{{ value.maximum }}"
            step="{{ value.step }}"
            value="{{ value.value }}"
            class="range {{ value.color }} {{ value.size }}"
            {% if field_label_hidden %}aria-label="{{ value.label|daisie_strip_markup }}"{% endif %}
          />
        </div>
      </div>
    {% else %}
      <label class="fieldset-legend" for="daisie-{{ block.id }}">{{ value.label }}</label>
      <input
        id="daisie-{{ block.id }}"
        type="range"
        {% if value.name %}name="{{ value.name }}"{% endif %}
        min="{{ value.minimum }}"
        max="{{ value.maximum }}"
        step="{{ value.step }}"
        value="{{ value.value }}"
        class="range {{ value.color }} {{ value.size }}"
      />
    {% endif %}
  </fieldset>
{% endif %}
