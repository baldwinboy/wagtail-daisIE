{% if audience_allowed %}
  <fieldset class="fieldset w-full{% if block_css %} {{ block_css }}{% endif %}">
    <label class="fieldset-legend" for="daisie-{{ block.id }}">{{ value.label }}</label>
    <input
      id="daisie-{{ block.id }}"
      type="range"
      {% if value.name %}name="{{ value.name }}"{% endif %}
      min="{{ value.minimum }}"
      max="{{ value.maximum }}"
      step="{{ value.step }}"
      value="{{ value.value }}"
      class="range {{ value.color }} {{ value.size }}"
    />
  </fieldset>
{% endif %}
