{% load notifications wagtail_daisIE_tags %}
{% if audience_allowed %}
  <div class="{% if block_css %}{{ block_css }}{% endif %}"{% if block_style %} style="{{ block_style }}"{% endif %}>
    <label class="label cursor-pointer justify-start gap-3">
      <input
        type="checkbox"
        role="switch"
        {% if value.name %}name="{{ value.name }}"{% endif %}
        {% if value.logic_key %}data-daisie-switch-key="{{ value.logic_key }}"{% if daisie_visibility_scope and daisie_visibility_scope != "page" %} data-daisie-switch-scope="{{ daisie_visibility_scope }}"{% endif %}{% endif %}
        class="toggle {{ value.color }} {{ value.size }}"
        {% if value.checked %}checked{% endif %}
      />
      <span class="label-text">{% daisie_markup value.label %}</span>
    </label>
    {% if value.helper_text %}<p class="label">{% daisie_markup value.helper_text %}</p>{% endif %}
    {% if value.logic_key %}{% daisie_switch_css value.logic_key daisie_visibility_scope %}{% endif %}
  </div>
{% endif %}
