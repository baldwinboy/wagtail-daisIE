{% load i18n %}
<form role="search" method="get" action="{{ menu.search_url|default:'/search/' }}" class="join">
  <label class="sr-only" for="navbar-search-{{ menu.name|slugify }}">{% trans "Search" %}</label>
  <input id="navbar-search-{{ menu.name|slugify }}"
         type="search"
         name="{{ menu.search_parameter|default:'query' }}"
         placeholder="{{ menu.search_placeholder|default:'Search' }}"
         autocomplete="off"
         class="input input-bordered join-item w-full">
  <button type="submit" class="btn join-item" aria-label="{% trans 'Search' %}">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
    </svg>
  </button>
</form>
