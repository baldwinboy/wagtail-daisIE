{% if messages %}
  <div class="mb-4 space-y-2" aria-live="polite">
    {% for message in messages %}
      <div
        role="alert"
        class="alert{% if message.extra_tags %} {{ message.extra_tags }}{% else %} alert-{{ message.level_tag }}{% endif %}"
      >
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
