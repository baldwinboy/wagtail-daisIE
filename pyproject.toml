[project]
name = "wagtail-daisIE"
version = "2.1.0"
description = "Create reusable DaisyUI themes through Wagtail"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
]
requires-python = ">=3.13"
dependencies = [
    "cssutils>=2.15.0,<3",
    "Django>=6.0,<6.1",
    "django-colorfield>=0.14.0,<0.15",
    "lxml>=6.1.3",
    "mjml-python>=1.4.2",
    "Wagtail>=8.0,<8.1",
]

[project.optional-dependencies]
allauth = [
    "django-allauth>=65.19.7,<66",
]
allauth_emails = [
    "wagtail-daisIE[notifications,allauth]",
]
notifications = []
blocks = [
    "draftail-text-utils>=0.3.1,<0.4",
]

[project.urls]
Homepage = "https://github.com/baldwinboy/wagtail-daisIE"
Repository = "https://github.com/baldwinboy/wagtail-daisIE"
Changelog = "https://github.com/baldwinboy/wagtail-daisIE/blob/main/CHANGELOG.md"
Documentation = "https://github.com/baldwinboy/wagtail-daisIE/blob/main/README.md"
Issues = "https://github.com/baldwinboy/wagtail-daisIE/issues"

[dependency-groups]
dev = [
    "dj-database-url==3.1.2",
    "django-allauth>=65.19.7,<66",
    "pre-commit==4.6.2",
    "prek==0.5.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "ruff==0.16.10",
]
[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_daisIE"
source-exclude = [
    "wagtail_daisIE/static_src",
    "wagtail_daisIE/test",
    "testmanage.py",
    ".*",
    "*.ini",
    "*.yml",
]

[tool.uv.build-backend.package-data]
"wagtail_daisIE/static/**" = ["*"]
"wagtail_daisIE/templates/**" = ["*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtail_daisIE.test.settings"
addopts = "--no-migrations"
