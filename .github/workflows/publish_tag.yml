# See https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# for a detailed guide
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this version is already on PyPI
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name=$(grep -E '^name\s*=' pyproject.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          echo "Checking pypi.org/pypi/$name/$version"
          if curl -fsS "https://pypi.org/pypi/${name}/${version}/json" >/dev/null 2>&1; then
            echo "Version $version already on PyPI — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [guard]
    if: ${{ needs.guard.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv build
      # Smoke tests with ready-to-publish package.
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import wagtail_daisIE; print('OK')"
      - run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import wagtail_daisIE; print('OK')"
      - name: Assert static assets are packaged
        run: |
          js=$(unzip -l dist/*.whl | grep -cE 'static/wagtail_daisIE/js/[^/]+\.js$')
          echo "JS assets in wheel: $js"
          test "$js" -ge 8
          unzip -l dist/*.whl | grep -qE 'static/wagtail_daisIE/css/daisie\.css$'
          unzip -l dist/*.whl | grep -qE 'wagtail_daisIE/templates/'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact
          path: ./dist

  publish:
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: none
      id-token: write # required for trusted publishing
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact
          path: artifact
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifact/
          print-hash: true
